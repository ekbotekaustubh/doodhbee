# ==============================================================================
# DoodhDesk SaaS - Production Docker Compose Stack
# Usage:
#   docker compose up -d --build
#   docker compose exec app php scripts/migrate.php
#   docker compose exec app php scripts/setup_admin.php
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doodhdesk_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "DoodhDesk SaaS"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "https://app.doodhdesk.com"
      ALLOW_DEMO_MODE: "false"
      APP_USE_INDEX_IN_URL: "false"
      APP_REWRITE_ENABLED: "true"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-doodhdesk_prod}"
      DB_USERNAME: "${DB_USERNAME:-doodhdesk_user}"
      DB_PASSWORD: "${DB_PASSWORD:-StrongDatabaseSecret123}"
    volumes:
      - doodhdesk_uploads:/var/www/doodhdesk/public/uploads
      - doodhdesk_storage:/var/www/doodhdesk/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: doodhdesk_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-RootStrongPassword123}"
      MYSQL_DATABASE: "${DB_DATABASE:-doodhdesk_prod}"
      MYSQL_USER: "${DB_USERNAME:-doodhdesk_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-StrongDatabaseSecret123}"
    volumes:
      - doodhdesk_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-RootStrongPassword123}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  doodhdesk_db_data:
  doodhdesk_uploads:
  doodhdesk_storage:
